<style>

function pool(){
  return D.filter(f=>{
    const mClass = !sel.t || f[0]===sel.t;
    const mChapter = !sel.c || f[1]===sel.c;
    const mSection = !sel.s || f[2]===sel.s;
    const mSearch = !sel.search || (f[3]+f[4]+f[1]+f[2]).toLowerCase().includes(sel.search.toLowerCase());
    return mClass && mChapter && mSection && mSearch;
  });
}
function uniq(a){return [...new Set(a)]}

function scoreBar(){return `<div class="score"><span>Верно: ${score.ok} из ${score.n}</span><button onclick="score={ok:0,n:0};saveScore();show()" style="border:0;background:none;color:var(--mute);cursor:pointer;font-size:12px">Сброс</button></div>`}

function quiz(q){
 $("view").innerHTML=`<div class="panel">${scoreBar()}<div>${q.text}</div><div class="opts" id="o">${q.opts.map(o=>`<button class="opt">${o}</button>`).join("")}</div><div id="fb"></div></div>`;
 let done=false;
 $("o").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
   if(done)return;done=true;score.n++;
   const good = b.innerHTML === q.ans;
   if(good)score.ok++;
   saveScore();
   $("o").querySelectorAll("button").forEach(x=>{
    if(x.innerHTML===q.ans)x.classList.add("ok");
    else if(x===b)x.classList.add("bad");
   });
   $("fb").innerHTML=`<div class="msg ${good?"ok":"bad"}">${good?"Верно":"Неверно."}</div><button class="btn" id="nq">Дальше</button>`;
   $("nq").onclick=show;
  }
 });
}

function conv(){
 const c=rnd(CONV),v=rnd(VALS);
 let ans;
 if(c[0]==="°C" && c[1]==="К") ans = v + 273.15;
 else if(c[0]==="К" && c[1]==="°C") ans = v - 273.15;
 else ans = +(v*c[2]).toPrecision(9);

 $("view").innerHTML=`<div class="panel">${scoreBar()}<div>Переведите: <b>${v} ${c[0]}</b> в <b>${c[1]}</b></div>
 <div style="margin-top:12px"><input class="ans" id="in" inputmode="decimal" autocomplete="off" aria-label="Ответ"> ${c[1]}</div><div id="fb"></div><button class="btn" id="ck">Проверить</button></div>`;
 $("in").focus();let done=false;
 const check=()=>{
  if(done){conv();return}
  const x=parseFloat($("in").value.replace(",","."));if(isNaN(x)){$("fb").innerHTML='<div class="msg bad">Введите число</div>';return}
  done=true;score.n++;const good=Math.abs(x-ans)<=Math.abs(ans)*1e-2+1e-5;if(good)score.ok++;
  saveScore();
  $("fb").innerHTML=`<div class="msg ${good?"ok":"bad"}">${good?"Верно":"Неверно. Правильный ответ: "+ans+" "+c[1]}</div>`;$("ck").textContent="Дальше"};
 $("ck").onclick=check;$("in").onkeydown=e=>{if(e.key==="Enter")check()};
}

const BG=9.8,brad=d=>d*Math.PI/180,bf=(x,n=2)=>(+x).toFixed(n).replace(".",",");
function bcalc(v,a,h){const vx=v*Math.cos(brad(a)),vy=v*Math.sin(brad(a)),T=(vy+Math.sqrt(vy*vy+2*BG*h))/BG;
 return{vx,vy,T,H:h+(vy>0?vy*vy/(2*BG):0),L:vx*T,vE:Math.hypot(vx,vy-BG*T)}}

window.addEventListener("resize",()=>{bMiniBind();bDraw()});

const burl=k=>{try{return localStorage.getItem("phys_url_"+k)||BURL[k]}catch(e){return BURL[k]}};
function bEmb(k,u){if(k==="video"){const m=u.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?"https://www.youtube.com/embed/"+m[1]:u}
 if(k==="slides")return u.replace(/\/(edit|pub|preview)[^]*$/,"/embed");
 return u+(u.includes("embedded=true")?"":(u.includes("?")?"&":"?")+"embedded=true")}
function bFrame(k,id,hint){const u=burl(k),el=$(id);if(!el)return;
 el.innerHTML=(u?`<div class="phet-container"><iframe src="${bEmb(k,u)}" allowfullscreen loading="lazy" title="${k}"></iframe></div><a class="btn" href="${u}" target="_blank" rel="noopener">${k==="forms"?"📝 Открыть итоговую Google Forms":"Открыть в новой вкладке"} ↗</a>`:`<div class="box">${hint}</div>`)+`<div class="mini-row"><input class="ans" id="${id}i" placeholder="Вставьте ссылку на материал…"><button class="btn btn-sm" id="${id}b">Показать</button></div>`;
 $(id+"b").onclick=()=>{try{localStorage.setItem("phys_url_"+k,$(id+"i").value.trim())}catch(e){}bFrame(k,id,hint)}}
function bVid(){$("bp").innerHTML=`<h3 style="margin-top:0">Учебное видео</h3><div class="box"><b>🎯 Цель просмотра:</b> увидеть, как движение под углом раскладывается на равномерное по x и равноускоренное по y, и запомнить, что происходит со скоростью в верхней точке.</div><div id="vf"></div>
 <div class="qc"><b>Вопрос после просмотра.</b> Почему в верхней точке траектории скорость тела не равна нулю, хотя v<sub>y</sub> = 0? Ответьте своими словами.<textarea id="vt" rows="3" placeholder="Ваш ответ…"></textarea><button class="btn btn-sm" id="vk">Сверить с образцом</button><div id="vr"></div></div>`;
 bFrame("video","vf","Видео ещё не добавлено: найдите урок по теме «Движение тела, брошенного под углом к горизонту», скопируйте ссылку YouTube и вставьте её ниже — плеер появится автоматически.");
 $("vk").onclick=()=>$("vr").innerHTML=`<div class="box"><b>Образец:</b> в верхней точке v<sub>y</sub> = 0, но горизонтальная составляющая v<sub>x</sub> = v₀cosα сохраняется (по горизонтали сил нет), поэтому v = v<sub>x</sub> ≠ 0. Самопроверка: ✔ упомянута v<sub>x</sub> = const; ✔ указано, что обнуляется только v<sub>y</sub>.</div>`}
function bMat(){const st=[["1. Разложить v₀","vₓ = v₀cosα;  v_y = v₀sinα"],["2. Время полёта T","T = (v_y + √(v_y² + 2g·y₀)) / g"],["3. Высота H","H = y₀ + v_y² / (2g)"],["4. Дальность L","L = vₓ · T"],["5. Проверить","единицы СИ, знак, смысл ответа"]];
 $("bp").innerHTML=`<h3 style="margin-top:0">Презентация</h3><p class="mute">Опубликуйте презентацию в Google Slides (Файл → Поделиться → Опубликовать в Интернете) и вставьте ссылку.</p><div id="sf"></div>
 <h3>Инфографика: алгоритм решения задачи</h3><svg viewBox="0 0 340 440" role="img" aria-label="Алгоритм решения задач на бросок под углом" style="width:100%;max-width:460px;display:block;margin:0 auto"><defs><linearGradient id="ig" x1="0" x2="1"><stop offset="0" stop-color="#0f6b5c"/><stop offset="1" stop-color="#5b7cfa"/></linearGradient></defs>
 ${st.map((s,i)=>`<g transform="translate(10,${i*86})"><rect width="320" height="68" rx="14" fill="url(#ig)"/><text x="16" y="28" fill="#fff" font-size="17" font-weight="700" font-family="Segoe UI,sans-serif">${s[0]}</text><text x="16" y="52" fill="#fff" font-size="15" font-family="Cambria Math,Cambria,serif">${s[1]}</text></g>${i<4?`<path d="M170,${i*86+70} v14 m-6,-6 l6,6 l6,-6" stroke="var(--ink)" stroke-width="2.5" fill="none" style="color:var(--ink)"/>`:""}`).join("")}</svg>`;
 bFrame("slides","sf","Презентация ещё не добавлена. Вставьте ссылку на Google Slides ниже.")}
function bSrc(){$("bp").innerHTML=`<h3 style="margin-top:0">Источники и авторство</h3><ol class="sol"><li>Перышкин А. В., Гутник Е. М. Физика. 9 класс: учебник. — М.: Дрофа (выходные данные уточните по используемому изданию).</li>

 <li>MDN Web Docs. <a href="https://developer.mozilla.org/ru/docs/Web/API/Canvas_API" target="_blank" rel="noopener">Canvas API</a> — технология отрисовки лаборатории.</li></ol>
 <div class="box"><b>Использование ИИ.</b> Проектирование структуры, тексты заданий и код ресурса подготовлены с помощью ИИ-ассистента (Claude, Anthropic). Автор проверил формулы, числовые примеры и расчёты вручную и несёт ответственность за содержание. Модель сопротивления воздуха (F ∝ v², k = 0,01 м⁻¹) упрощённая, учебная.</div>
 <p class="mute" style="font-size:13px">Видео, презентация и итоговая Google Forms подключаются по ссылкам автора (вкладки «Видео», «Материалы», «Проверка»).</p>`}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem("phys_theme",t)}catch(e){}$("th").textContent=t==="dark"?"☀️ Светлая тема":"🌙 Тёмная тема";bDraw();bMiniBind()}
let th0=null;try{th0=localStorage.getItem("phys_theme")}catch(e){}
setTheme(th0||(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"));
$("th").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

renderTabs();renderFilters();show();
